<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Документы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f1f1f4);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#fff));
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8a8e);
  --accent:var(--tg-theme-button-color,#2a83f6);
  --accent-text:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-link-color,#2a83f6);
  --danger:var(--tg-theme-destructive-text-color,#e5484d);
  --line:rgba(128,128,128,.18);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:14px 16px 48px}
h1{font-size:21px;margin:4px 4px 14px;word-break:break-word}
.sub{color:var(--hint);font-size:13px;margin:-10px 4px 16px}
.section{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 6px}
.note{font-size:13px;color:var(--hint);margin:0 4px 6px}
.list{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item:active{background:var(--line)}
.grow{flex:1;min-width:0}
.t{font-weight:500;word-break:break-word}
.h{color:var(--hint);font-size:13px}
.v{word-break:break-word;margin-top:1px}
.chev,.cp{color:var(--hint);font-size:18px}
.ico{font-size:22px;width:28px;text-align:center;flex:none}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;flex:none}
.badge{font-size:11px;padding:3px 7px;border-radius:6px;background:var(--line);color:var(--hint);flex:none}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:500;margin:0 0 10px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--link)}
.btn.danger{background:var(--card);color:var(--danger)}
.btn:active{opacity:.75}
.row{display:flex;gap:10px}
.row .btn{flex:1}
label{display:block;font-size:12px;color:var(--hint);margin:12px 4px 5px}
.textblock{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;line-height:1.55;user-select:text;-webkit-user-select:text}
textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit;line-height:1.5;outline:none;resize:vertical}
textarea:focus{border-color:var(--accent)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.fieldedit{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.fieldedit .fk{flex:0 0 38%}
.mv{border:0;background:var(--line);color:var(--link);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer;flex:none}
.x{border:0;background:none;color:var(--danger);font-size:24px;line-height:1;padding:2px 6px;cursor:pointer;flex:none}
.empty{color:var(--hint);text-align:center;padding:26px 0}
.err{background:var(--card);border-radius:12px;padding:16px;color:var(--danger);user-select:text;-webkit-user-select:text}
.viewer img,.viewer canvas{width:100%;display:block;border-radius:8px;margin-bottom:10px;background:#fff}
.gap{height:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);max-width:90%;background:rgba(20,20,20,.88);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<input type="file" id="fileInput" hidden multiple accept="application/pdf,image/jpeg,image/png,image/webp">

<script>
/* ===== Вставьте сюда URL веб-приложения Apps Script (…/exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxifQ9ifbtY4hMk2b7ykkfNzOEvMuRNW95WuPjf75wsg_yaiEVzJ17U71xesy3xXMjQaw/exec';

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { if (tg.isVersionAtLeast('6.1')) { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } } catch (e) {}
}

const MAX_MB = 15;
const ALLOWED = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'];
// Шаблоны текста: строки «Название: » — значения дописываются после двоеточия
const TEMPLATES = {
  'Паспорт РФ': ['Серия и номер паспорта', 'ФИО', 'ФИО (латинскими буквами)', 'Дата рождения', 'Пол', 'Место рождения', 'Код подразделения', 'Кем выдан', 'Дата выдачи', 'Адрес по месту постоянной регистрации'],
  'Загранпаспорт': ['Номер', 'ФИО (латинскими буквами)', 'Дата рождения', 'Дата выдачи', 'Действителен до', 'Кем выдан'],
  'Свидетельство о рождении': ['Серия и номер', 'ФИО', 'Дата рождения', 'Место рождения', 'Отец', 'Мать', 'Номер актовой записи', 'Орган ЗАГС', 'Дата выдачи'],
  'СНИЛС': ['Номер СНИЛС'],
  'ИНН': ['ИНН'],
  'Полис ОМС': ['Номер полиса', 'Страховая компания'],
  'Полис ДМС': ['Номер полиса', 'Страховая компания', 'Действует до', 'Телефон для записи'],
  'Водительское удостоверение': ['Серия и номер', 'Категории', 'Дата выдачи', 'Действительно до'],
  'Военный билет': ['Серия и номер', 'Дата выдачи', 'Военный комиссариат'],
  'Диплом': ['Учебное заведение', 'Специальность', 'Серия и номер', 'Регистрационный номер', 'Дата выдачи'],
  'Сертификат о прививках': ['Номер', 'Поликлиника'],
  'Медицинская карта (ф. 026/у)': ['Поликлиника', 'Дата оформления'],
  'Договор с детским садом': ['Номер договора', 'Детский сад', 'Дата'],
  'Свидетельство о браке': ['Серия и номер', 'Супруги', 'Дата регистрации брака', 'Номер актовой записи', 'Орган ЗАГС'],
  'Сертификат на материнский капитал': ['Серия и номер', 'Дата выдачи'],
  'Удостоверение многодетной семьи': ['Номер', 'Дата выдачи', 'Действительно до'],
  'Страховой полис': ['Номер полиса', 'Страховая компания', 'Действует до'],
  'Ветеринарный паспорт': ['Кличка', 'Порода', 'Дата рождения', 'Номер паспорта', 'Последняя прививка'],
  'Свидетельство о чипировании': ['Номер чипа', 'Дата чипирования', 'Клиника'],
  'Родословная': ['Номер', 'Клуб'],
  'Выписка из ЕГРН': ['Кадастровый номер', 'Адрес', 'Дата выписки'],
  'Договор': ['Номер договора', 'Дата', 'Стороны'],
  'Ипотечный договор': ['Банк', 'Номер договора', 'Дата'],
  'Технический паспорт': ['Номер', 'Дата'],
  'Договор с управляющей компанией': ['Управляющая компания', 'Лицевой счёт', 'Телефон'],
  'СТС': ['Серия и номер', 'Госномер', 'VIN'],
  'ПТС': ['Номер ЭПТС', 'VIN'],
  'Сервисная книжка': ['Дилер', 'Последнее ТО'],
  'Другое': []
};
const TYPE_ORDER = Object.keys(TEMPLATES);
const tplText = t => (TEMPLATES[t] || []).map(l => l + ': ').join('\n');

// Всё хранится только в памяти страницы: при закрытии приложения данные исчезают с устройства
let S = { me: null, members: [], docs: [], users: [] };
const fileCache = {};
let stack = [];
let busy = false;
let uploadDocId = null;

/* ---------- Утилиты ---------- */
const $app = document.getElementById('app');
const set = h => { $app.innerHTML = h; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const val = id => ((document.getElementById(id) || {}).value || '').trim();
const cur = () => stack[stack.length - 1];
const isAdmin = () => S.me && S.me.role === 'admin';
const memberOf = id => S.members.find(m => m.id === id);
const docOf = id => S.docs.find(d => d.id === id);
const typeIdx = t => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? 99 : i; };
function upsertLocal(arr, obj) { const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); }
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return n + ' ' + (m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); }
function btn(text, act, cls = '', data = {}) {
  const attrs = Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
  return `<button class="btn ${cls}" data-act="${act}" ${attrs}>${text}</button>`;
}
let toastT;
function toast(msg, ms = 1800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function haptic(type = 'success') { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function ask(msg) {
  return new Promise(res => {
    try { if (tg && tg.isVersionAtLeast('6.2')) return tg.showConfirm(msg, ok => res(!!ok)); } catch (e) {}
    res(window.confirm(msg));
  });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('Скопировано'); haptic();
}
const readB64 = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1]);
  r.onerror = () => rej(r.error);
  r.readAsDataURL(f);
});

async function api(action, params = {}) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ initData: tg ? tg.initData : '', action }, params)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

/* ---------- Навигация ---------- */
function go(view, args = {}) { stack.push({ view, args }); render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function replace(view, args = {}) { stack[stack.length - 1] = { view, args }; render(); }
function render(keepScroll) {
  const c = cur();
  if (tg) { if (stack.length > 1) tg.BackButton.show(); else tg.BackButton.hide(); }
  if (!keepScroll) window.scrollTo(0, 0);
  Promise.resolve(VIEWS[c.view](c.args)).catch(e => set(`<div class="err">${esc(e.message)}</div>`));
}
if (tg) tg.BackButton.onClick(back);

/* ---------- Просмотр PDF ---------- */
let pdfWorkerReady = null;
function pdfWorker() {
  // Модуль PDF загружаем как свой (blob), иначе в WebView телефона он может не запуститься
  if (!pdfWorkerReady) {
    pdfWorkerReady = fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')
      .then(r => { if (!r.ok) throw new Error('модуль PDF не загрузился'); return r.text(); })
      .then(code => { pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' })); })
      .catch(e => { pdfWorkerReady = null; throw e; });
  }
  return pdfWorkerReady;
}
async function renderPdf(box, b64) {
  if (!window.pdfjsLib) throw new Error('модуль PDF не загрузился');
  await pdfWorker();
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const pdf = await pdfjsLib.getDocument({ data: bytes, isEvalSupported: false }).promise;
  box.innerHTML = '';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const width = Math.max(box.clientWidth || 0, 320);
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const base = page.getViewport({ scale: 1 });
    // ширина экрана × плотность пикселей, но не больше ~12 Мп на страницу (лимит холста в iOS)
    let scale = (width * dpr) / base.width;
    scale = Math.min(scale, Math.sqrt(12e6 / (base.width * base.height)), 4);
    const vp = page.getViewport({ scale });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    box.appendChild(c);
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    page.cleanup();
  }
}

/* ---------- Экраны ---------- */
const VIEWS = {
  members() {
    const ms = [...S.members].sort((a, b) => a.order - b.order);
    let h = `<h1>Документы семьи</h1>`;
    h += ms.length
      ? `<div class="list">${ms.map(m => {
          const n = S.docs.filter(d => d.member_id === m.id).length;
          return `<div class="item" data-act="openMember" data-id="${esc(m.id)}">
            <div class="avatar">${esc((m.name || '?')[0].toUpperCase())}</div>
            <div class="grow"><div class="t">${esc(m.name)}</div><div class="h">${plural(n, 'документ', 'документа', 'документов')}</div></div>
            <span class="chev">›</span></div>`;
        }).join('')}</div>`
      : `<div class="empty">Пока никого нет</div>`;
    if (isAdmin()) h += `<div class="gap"></div>` + btn('+ Член семьи', 'addMember', 'sec') + btn('Пользователи и доступ', 'openUsers', 'sec');
    set(h);
  },

  member({ id }) {
    const m = memberOf(id); if (!m) return back();
    const ds = S.docs.filter(d => d.member_id === id);
    let h = `<h1>${esc(m.name)}</h1>`;
    h += ds.length
      ? `<div class="list">${ds.map(d => `<div class="item" data-act="openDoc" data-id="${esc(d.id)}">
          <div class="ico">${d.files.length ? '📄' : '📝'}</div>
          <div class="grow"><div class="t">${esc(d.title)}</div>
          <div class="h">${d.title !== d.type ? esc(d.type) + ' · ' : ''}${plural(d.files.length, 'файл', 'файла', 'файлов')}</div></div>
          <span class="chev">›</span></div>`).join('')}</div>`
      : `<div class="empty">Документов пока нет</div>`;
    if (isAdmin()) h += `<div class="gap"></div>` + btn('+ Документ', 'addDoc', '', { id })
      + `<div class="row">${btn('Настроить', 'editMember', 'sec', { id })}${btn('Удалить', 'deleteMember', 'danger', { id })}</div>`;
    set(h);
  },

  doc({ id }) {
    const d = docOf(id); if (!d) return back();
    const m = memberOf(d.member_id);
    let h = `<h1>${esc(d.title)}</h1><div class="sub">${esc(m ? m.name : '')}${d.title !== d.type ? ' · ' + esc(d.type) : ''}</div>`;
    h += `<div class="section">Данные</div>`;
    h += d.text.trim()
      ? `<div class="textblock">${esc(d.text)}</div>` + btn('Скопировать', 'copy', '', { id: d.id })
      : `<div class="empty">Данные не заполнены</div>`;
    h += `<div class="section">Сканы</div>`;
    h += d.files.length
      ? `<div class="list">${d.files.map(f => `<div class="item" data-act="openFile" data-doc="${esc(d.id)}" data-id="${esc(f.id)}">
          <div class="ico">${f.mime === 'application/pdf' ? '📄' : '🖼'}</div>
          <div class="grow"><div class="t">${esc(f.name)}</div><div class="h">${f.mime === 'application/pdf' ? 'PDF' : 'Изображение'}</div></div>
          ${isAdmin() ? `<button class="mv" data-act="moveFile" data-doc="${esc(d.id)}" data-id="${esc(f.id)}" aria-label="Переместить">Переместить</button><button class="x" data-act="deleteFile" data-doc="${esc(d.id)}" data-id="${esc(f.id)}" aria-label="Удалить">×</button>` : '<span class="chev">›</span>'}
        </div>`).join('')}</div>`
      : `<div class="empty">Сканов нет</div>`;
    if (isAdmin()) h += btn('+ Загрузить PDF / JPG', 'upload', '', { id: d.id })
      + `<div class="row">${btn('Редактировать', 'editDoc', 'sec', { id: d.id })}${btn('Удалить', 'deleteDoc', 'danger', { id: d.id })}</div>`;
    set(h);
  },

  async viewer({ docId, fileId }) {
    const d = docOf(docId); if (!d) return back();
    const f = d.files.find(x => x.id === fileId); if (!f) return back();
    set(`<h1>${esc(d.title)}</h1><div class="sub">${esc(f.name)}</div>
      <div class="viewer" id="vw"><div class="empty">Загрузка…</div></div>
      ${btn('Открыть в Telegram', 'send', f.mime === 'application/pdf' ? '' : 'sec', { doc: docId, id: fileId, close: '1' })}
      <div class="note">Пришлёт файл в чат с ботом и закроет приложение — в чате файл откроется во встроенном просмотрщике Telegram, его можно увеличить, сохранить или переслать.</div>`);
    const vw = document.getElementById('vw');
    try {
      if (!fileCache[fileId]) fileCache[fileId] = (await api('file', { docId, fileId })).data;
      if (cur().view !== 'viewer' || cur().args.fileId !== fileId) return;
      const b64 = fileCache[fileId];
      if (f.mime === 'application/pdf') {
        await Promise.race([
          renderPdf(vw, b64),
          new Promise((_, rej) => setTimeout(() => rej(new Error('слишком долго')), 20000))
        ]);
      } else {
        vw.innerHTML = `<img alt="" src="data:${esc(f.mime)};base64,${b64}">`;
      }
    } catch (e) {
      vw.innerHTML = `<div class="err">Не удалось показать файл здесь (${esc(e.message)}).<br>Нажмите «Открыть в Telegram» ниже.</div>`;
    }
  },

  move({ docId, fileId, memberId }) {
    const d = docOf(docId); const f = d && d.files.find(x => x.id === fileId);
    if (!f) return back();
    if (!memberId) {
      const ms = [...S.members].sort((a, b) => a.order - b.order);
      set(`<h1>Переместить скан</h1><div class="sub">${esc(f.name)} — выберите раздел</div>
        <div class="list">${ms.map(m => `<div class="item" data-act="movePickMember" data-doc="${esc(docId)}" data-file="${esc(fileId)}" data-id="${esc(m.id)}">
          <div class="avatar">${esc((m.name || '?')[0].toUpperCase())}</div>
          <div class="grow"><div class="t">${esc(m.name)}</div></div><span class="chev">›</span></div>`).join('')}</div>`);
      return;
    }
    const m = memberOf(memberId);
    const ds = S.docs.filter(x => x.member_id === memberId && x.id !== docId);
    set(`<h1>${esc(m ? m.name : '')}</h1><div class="sub">В какой документ положить «${esc(f.name)}»?</div>
      ${ds.length ? `<div class="list">${ds.map(x => `<div class="item" data-act="moveTo" data-doc="${esc(docId)}" data-file="${esc(fileId)}" data-id="${esc(x.id)}">
        <div class="ico">${x.files.length ? '📄' : '📝'}</div>
        <div class="grow"><div class="t">${esc(x.title)}</div><div class="h">${plural(x.files.length, 'файл', 'файла', 'файлов')}</div></div>
        <span class="chev">›</span></div>`).join('')}</div>` : '<div class="empty">В этом разделе нет документов</div>'}`);
  },

  editMember({ id }) {
    const m = id ? memberOf(id) : null;
    set(`<h1>${m ? 'Настройки раздела' : 'Новый раздел'}</h1>
      <label>Имя</label><input id="mName" value="${esc(m ? m.name : '')}" placeholder="Имя" autocomplete="off">
      <label>Имя для файлов (например, ИвановаАБ)</label><input id="mPrefix" value="${esc(m ? m.prefix || '' : '')}" placeholder="${esc(m ? m.name : 'Как называть файлы')}" autocomplete="off">
      <div class="note">Файлы в чат придут как «${esc(m && m.prefix ? m.prefix : (m ? m.name : 'Имя'))}_Загранпаспорт.pdf». Пусто — используется имя раздела.</div>
      <div class="gap"></div>${btn('Сохранить', 'saveMember', '', { id: id || '' })}`);
  },

  editDoc(a) {
    if (!a.draft) {
      const d = a.id ? docOf(a.id) : null;
      const t = 'Паспорт РФ';
      a.draft = d
        ? { id: d.id, member_id: d.member_id, type: d.type, title: d.title, text: d.text }
        : { id: '', member_id: a.memberId, type: t, title: t, text: tplText(t) };
    }
    const dr = a.draft;
    const types = TYPE_ORDER.includes(dr.type) ? TYPE_ORDER : [dr.type, ...TYPE_ORDER];
    set(`<h1>${dr.id ? 'Редактировать' : 'Новый документ'}</h1>
      <label>Тип</label><select id="dType">${types.map(t => `<option ${t === dr.type ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <label>Название</label><input id="dTitle" value="${esc(dr.title)}" autocomplete="off">
      <label>Данные — допишите значения после двоеточий</label>
      <textarea id="dText" rows="12" autocomplete="off">${esc(dr.text)}</textarea>
      <div class="gap"></div>${btn('Сохранить', 'saveDoc')}
      ${dr.id ? '' : '<div class="note">Сканы загрузите после сохранения.</div>'}`);
  },

  async users() {
    set(`<h1>Пользователи</h1><div class="empty">Загрузка…</div>`);
    S.users = await api('users');
    if (cur().view === 'users') drawUsers();
  }
};

function drawUsers() {
  set(`<h1>Пользователи</h1>
    <div class="sub">Админ загружает, правит и удаляет. Остальные — только просмотр и копирование.</div>
    <div class="list">${S.users.map(u => `<div class="item">
      <div class="grow"><div class="t">${esc(u.name)}</div><div class="h">ID ${esc(u.tg_id)}</div></div>
      <span class="badge">${u.role === 'admin' ? 'админ' : 'просмотр'}</span>
      ${u.tg_id === S.me.tg_id ? '' : `<button class="x" data-act="deleteUser" data-id="${esc(u.tg_id)}" aria-label="Удалить">×</button>`}
    </div>`).join('')}</div>
    <div class="section">Добавить</div>
    <div class="note">Пусть человек откроет бота: приложение покажет ему его Telegram ID.</div>
    <label>Telegram ID</label><input id="uId" inputmode="numeric" autocomplete="off">
    <label>Имя</label><input id="uName" autocomplete="off">
    <label>Права</label><select id="uRole"><option value="user">Просмотр</option><option value="admin">Админ</option></select>
    <div class="gap"></div>${btn('Добавить', 'saveUser')}`);
}

function syncDraft() {
  const dr = cur().args.draft;
  dr.type = val('dType') || dr.type;
  dr.title = val('dTitle');
  const ta = document.getElementById('dText');
  if (ta) dr.text = ta.value.replace(/\s+$/, '');
}

/* ---------- Действия ---------- */
const ACT = {
  openMember: d => go('member', { id: d.id }),
  openDoc: d => go('doc', { id: d.id }),
  openFile: d => go('viewer', { docId: d.doc, fileId: d.id }),
  openUsers: () => go('users'),

  copy: d => copyText(docOf(d.id).text),
  async send(d) {
    toast('Отправляю…', 30000);
    await api('send', { docId: d.doc, fileId: d.id });
    toast('Отправлено в чат с ботом'); haptic();
    if (d.close && tg) setTimeout(() => tg.close(), 700);
  },

  addMember: () => go('editMember', {}),
  editMember: d => go('editMember', { id: d.id }),
  async saveMember(d) {
    const name = val('mName'); if (!name) return toast('Введите имя');
    const m = await api('saveMember', { member: { id: d.id || '', name, prefix: val('mPrefix') } });
    upsertLocal(S.members, m); haptic(); back();
  },
  async deleteMember(d) {
    const m = memberOf(d.id);
    if (!await ask(`Удалить «${m.name}» и все документы со сканами?`)) return;
    await api('deleteMember', { id: d.id });
    S.members = S.members.filter(x => x.id !== d.id);
    S.docs = S.docs.filter(x => x.member_id !== d.id);
    stack = [stack[0]]; render();
  },

  addDoc: d => go('editDoc', { memberId: d.id }),
  editDoc: d => go('editDoc', { id: d.id }),
  async saveDoc() {
    syncDraft();
    const dr = cur().args.draft;
    if (!dr.title) return toast('Введите название');
    const doc = await api('saveDoc', { doc: dr });
    upsertLocal(S.docs, doc); haptic();
    if (dr.id) back(); else replace('doc', { id: doc.id });
  },
  async deleteDoc(d) {
    if (!await ask(`Удалить «${docOf(d.id).title}» вместе со сканами?`)) return;
    await api('deleteDoc', { id: d.id });
    S.docs = S.docs.filter(x => x.id !== d.id); back();
  },

  upload(d) {
    uploadDocId = d.id;
    const fi = document.getElementById('fileInput');
    fi.value = ''; fi.click();
  },
  moveFile: d => go('move', { docId: d.doc, fileId: d.id }),
  movePickMember: d => go('move', { docId: d.doc, fileId: d.file, memberId: d.id }),
  async moveTo(d) {
    const r = await api('moveFile', { docId: d.doc, fileId: d.file, toDocId: d.id });
    upsertLocal(S.docs, r.dst);
    if (r.src) upsertLocal(S.docs, r.src); else S.docs = S.docs.filter(x => x.id !== r.srcId);
    while (stack.length > 1 && cur().view === 'move') stack.pop();
    if (!r.src && cur().view === 'doc' && stack.length > 1) stack.pop();
    toast(`Перемещено в «${r.dst.title}»`); haptic(); render();
  },
  async deleteFile(d) {
    if (!await ask('Удалить этот скан?')) return;
    const doc = await api('deleteFile', { docId: d.doc, fileId: d.id });
    delete fileCache[d.id];
    upsertLocal(S.docs, doc); render(true);
  },

  async saveUser() {
    const u = { tg_id: val('uId'), name: val('uName'), role: val('uRole') };
    if (!u.tg_id) return toast('Введите Telegram ID');
    S.users = await api('saveUser', { user: u });
    drawUsers(); toast('Добавлено'); haptic();
  },
  async deleteUser(d) {
    if (!await ask('Закрыть доступ этому пользователю?')) return;
    S.users = await api('deleteUser', { id: d.id });
    drawUsers();
  }
};

async function uploadFiles(list) {
  const fs = [...list]; if (!fs.length) return;
  busy = true;
  let done = 0;
  try {
    for (let i = 0; i < fs.length; i++) {
      const f = fs[i];
      if (!ALLOWED.includes(f.type)) { toast(`${f.name}: только PDF, JPG, PNG`, 2500); continue; }
      if (f.size > MAX_MB * 1024 * 1024) { toast(`${f.name}: больше ${MAX_MB} МБ`, 2500); continue; }
      toast(`Загрузка ${i + 1} из ${fs.length}…`, 120000);
      const data = await readB64(f);
      const doc = await api('upload', { docId: uploadDocId, name: f.name, mime: f.type, data });
      upsertLocal(S.docs, doc); done++;
    }
    if (done) { toast(`Загружено: ${done}`); haptic(); }
    if (cur().view === 'doc') render(true);
  } catch (e) {
    toast(e.message, 3500); haptic('error');
  } finally { busy = false; }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  e.stopPropagation();
  if (busy) return;
  busy = true;
  try { await ACT[el.dataset.act](Object.assign({}, el.dataset), el); }
  catch (err) { toast(err.message, 3500); haptic('error'); }
  finally { busy = false; }
});

document.addEventListener('change', e => {
  if (e.target.id === 'fileInput') return uploadFiles(e.target.files);
  if (e.target.id === 'dType') {
    syncDraft();
    const dr = cur().args.draft;
    const t = e.target.value;
    if (!dr.title || dr.title === dr.type) dr.title = t === 'Другое' ? '' : t;
    if (!dr.text.trim() || dr.text === tplText(dr.type)) dr.text = tplText(t);
    dr.type = t;
    VIEWS.editDoc(cur().args);
  }
});

/* ---------- Старт ---------- */
(async function start() {
  if (!tg || !tg.initData) { set(`<div class="err">Откройте приложение через бота в Telegram.</div>`); return; }
  set(`<div class="empty">Загрузка…</div>`);
  try {
    const d = await api('init');
    S.me = d.me; S.members = d.members; S.docs = d.docs;
    stack = [{ view: 'members', args: {} }];
    render();
  } catch (e) {
    set(`<div class="err">${esc(e.message)}</div>`);
  }
})();
</script>
</body>
</html>
